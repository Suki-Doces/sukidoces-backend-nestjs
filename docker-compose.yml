version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sukidoces
      MYSQL_USER: sukidoces
      MYSQL_PASSWORD: sukidoces
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: builder
    command: sh -c "npm run migration:run && npm run start:dev"
    restart: unless-stopped
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://sukidoces:sukidoces@mysql:3306/sukidoces
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  mysql_data:
