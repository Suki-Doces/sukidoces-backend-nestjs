name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://sukidoces:sukidoces@127.0.0.1:3306/sukidoces
      TEST_DATABASE_URL: mysql://sukidoces:sukidoces@127.0.0.1:3306/sukidoces
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: sukidoces
          MYSQL_USER: sukidoces
          MYSQL_PASSWORD: sukidoces
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usukidoces -psukidoces"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Check the dependency rule between layers
        run: npm run check:architecture
      - name: Apply migrations to MySQL
        run: npm run migration:run
      - name: Integration tests
        run: npm test -- --ci
      - name: Build
        run: npm run build
