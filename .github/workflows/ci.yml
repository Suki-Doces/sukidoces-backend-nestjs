name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    env:
      DATABASE_URL: mysql://sukidoces:sukidoces@127.0.0.1:3306/sukidoces
      TEST_DATABASE_URL: mysql://sukidoces:sukidoces@127.0.0.1:3306/sukidoces

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: sukidoces
          MYSQL_USER: sukidoces
          MYSQL_PASSWORD: sukidoces
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=10s

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Check the dependency rule between layers
        run: npm run check:architecture

      - name: Wait for MySQL (safety net)
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null && exit 0
            sleep 2
          done
          echo "MySQL não respondeu em 60s"; exit 1

      - name: Apply migrations to MySQL
        run: npm run migration:run

      - name: Integration tests
        # Dica: Adicione --coverage aqui (ex: npm test -- --ci --coverage) para gerar a pasta coverage/
        run: npm test -- --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        # O 'if: always()' garante que a cobertura suba mesmo se os testes falharem
        if: always() 
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7 # Salva o relatório por 7 dias para economizar espaço

      - name: Build
        run: npm run build