name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://user:pass@localhost:3306/test
      JWT_SECRET: ci-test-secret-not-used-in-prod-1234567890
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-used-in-prod-1234567890
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
      - name: E2E tests
        run: npm run test:e2e -- --ci
      - name: Build
        run: npm run build
